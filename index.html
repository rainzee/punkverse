<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Punk Forge</title>
    <link rel="stylesheet" href="./src/app.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <canvas id="logo"></canvas>
        <h1>PUNK FORGE</h1>
      </div>
      <button id="btn-random" class="primary">随机</button>
    </header>

    <main class="layout">
      <aside class="panel">
        <section>
          <input id="seed" spellcheck="false" autocomplete="off" />
        </section>
        <section>
          <div class="dim"><span>世界</span><div id="worlds" class="chips"></div></div>
          <div class="dim"><span>性别</span><div id="sexes" class="chips"></div></div>
          <div class="dim"><span>物种</span><div id="species" class="chips"></div></div>
          <div id="skins" class="chips"></div>
        </section>
        <section>
          <div id="slots" class="slots"></div>
          <button id="btn-unlock" class="link">重置</button>
        </section>
        <section>
          <div class="row">
            <label class="check"><input type="checkbox" id="bg" checked /> 背景</label>
            <select id="size">
              <option value="24">24 px</option>
              <option value="480">480 px</option>
              <option value="1024" selected>1024 px</option>
              <option value="2048">2048 px</option>
            </select>
          </div>
          <div class="row btns">
            <button id="dl-png">PNG</button>
            <button id="dl-svg">SVG</button>
            <button id="dl-json">JSON</button>
            <button id="copy-link">链接</button>
          </div>
        </section>
      </aside>

      <section class="stage">
        <div class="card">
          <div class="preview-wrap"><canvas id="preview"></canvas></div>
          <ul id="attrs"></ul>
        </div>
        <div id="styles" class="styles"></div>
      </section>
    </main>

    <section class="gallery">
      <div id="gallery" class="grid"></div>
      <button id="btn-batch">换一批</button>
    </section>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
